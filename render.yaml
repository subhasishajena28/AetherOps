services:
  - type: web
    name: aetherops-scanner
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: STORAGE_MODE
        value: gateway
      - key: CORS_ORIGINS
        sync: false
      - key: GATEWAY_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SCANNER_GATEWAY_SECRET
        sync: false
